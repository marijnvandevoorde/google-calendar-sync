<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Math Adventure">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#18c8ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Full-bleed background so the icon works as a maskable icon -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- sparkles -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M96 96 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7z"/>
    <path d="M430 70 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z"/>
    <circle cx="70" cy="300" r="6"/>
    <circle cx="452" cy="360" r="8"/>
  </g>

  <!-- 2x2 grid of operator tiles (kept within the maskable safe zone) -->
  <g filter="url(#soft)">
    <!-- + (blue) -->
    <g transform="translate(128,128)">
      <rect width="118" height="118" rx="30" fill="#ffffff"/>
      <g fill="#4d9dff">
        <rect x="49" y="24" width="20" height="70" rx="10"/>
        <rect x="24" y="49" width="70" height="20" rx="10"/>
      </g>
    </g>
    <!-- − (pink) -->
    <g transform="translate(266,128)">
      <rect width="118" height="118" rx="30" fill="#ffffff"/>
      <rect x="24" y="49" width="70" height="20" rx="10" fill="#ff6bcb"/>
    </g>
    <!-- × (orange) -->
    <g transform="translate(128,266)">
      <rect width="118" height="118" rx="30" fill="#ffffff"/>
      <g fill="#ff9f43" transform="rotate(45 59 59)">
        <rect x="49" y="24" width="20" height="70" rx="10"/>
        <rect x="24" y="49" width="70" height="20" rx="10"/>
      </g>
    </g>
    <!-- ÷ (green) -->
    <g transform="translate(266,266)">
      <rect width="118" height="118" rx="30" fill="#ffffff"/>
      <g fill="#2ecc71">
        <rect x="24" y="49" width="70" height="20" rx="10"/>
        <circle cx="59" cy="34" r="12"/>
        <circle cx="59" cy="84" r="12"/>
      </g>
    </g>
  </g>
</svg>
