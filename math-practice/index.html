<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7c4dff" />
  <title>Math Adventure 🚀</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Math" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Top bar -->
    <header class="topbar">
      <div class="score" id="score" aria-label="Stars earned">
        <span class="score-star">⭐</span>
        <span id="scoreValue">0</span>
      </div>
      <div class="streak" id="streakBox" title="Streak">
        <span id="streakFlame">🔥</span>
        <span id="streakValue">0</span>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙️</button>
    </header>

    <!-- Play area -->
    <main class="play">
      <div class="mascot" id="mascot">🦄</div>

      <div class="equation" id="equation">
        <span class="operand" id="opA">3</span>
        <span class="operator" id="operator">+</span>
        <span class="operand" id="opB">4</span>
        <span class="equals">=</span>
        <span class="answer-box" id="answerBox">?</span>
      </div>

      <div class="feedback" id="feedback"></div>
    </main>

    <!-- Numpad -->
    <section class="numpad" id="numpad">
      <button class="key num" data-key="1">1</button>
      <button class="key num" data-key="2">2</button>
      <button class="key num" data-key="3">3</button>
      <button class="key num" data-key="4">4</button>
      <button class="key num" data-key="5">5</button>
      <button class="key num" data-key="6">6</button>
      <button class="key num" data-key="7">7</button>
      <button class="key num" data-key="8">8</button>
      <button class="key num" data-key="9">9</button>
      <button class="key action clear" data-key="clear" aria-label="Clear">⌫</button>
      <button class="key num" data-key="0">0</button>
      <button class="key action check" data-key="check" aria-label="Check answer">✓</button>
    </section>
  </div>

  <!-- Settings modal -->
  <div class="modal-overlay" id="settingsModal" hidden>
    <div class="modal">
      <h2>Settings 🎛️</h2>

      <div class="setting-block">
        <label class="setting-label">How high do we go?</label>
        <div class="slider-row">
          <input type="range" id="maxRange" min="5" max="100" step="1" value="20" />
          <span class="max-value" id="maxValue">20</span>
        </div>
      </div>

      <div class="setting-block">
        <label class="setting-label">Which math?</label>
        <div class="op-toggles" id="opToggles">
          <button class="op-toggle" data-op="+"><span class="op-emoji">➕</span>Plus</button>
          <button class="op-toggle" data-op="-"><span class="op-emoji">➖</span>Minus</button>
          <button class="op-toggle" data-op="*"><span class="op-emoji">✖️</span>Times</button>
          <button class="op-toggle" data-op="/"><span class="op-emoji">➗</span>Divide</button>
        </div>
        <p class="hint" id="opHint"></p>
      </div>

      <button class="big-btn" id="closeSettings">Let's play! 🎉</button>
    </div>
  </div>

  <!-- Confetti canvas -->
  <canvas id="confetti"></canvas>

  <script src="app.js"></script>
</body>
</html>
